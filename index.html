<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Papper Sissor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>ROCK PAPPER SCISSORS</h1>
    <div class="choices">
        <div class="choice" id="rock">
            <img src="rock1.png" alt="">
        </div>
        <div class="choice" id="paper">
            <img src="paper1.png" alt="">
        </div>
        <div class="choice"  id="scissor">
            <img src="scissor1.png" alt="">
        </div>

    </div>

    <div class="msgcontainer">
        <div class="msg">Play your move</div>
    </div>

    <div class="scoreboardcenter">
        <div class="scoreboard">
        <div class="score">
            <p id="userscore">0</p>
            <p>You</p>
        </div>
        <div class="score">
             <p id="compscore">0</p>
            <p>Computer</p>
        </div>
    </div>

    </div>

    <button>Reset Game</button>
    <audio src="mouse-click-290204.mp3"></audio>
    
    <p class="created">Created by Ganesh Naik @-IIT BBS</p>
    
    <script src="script.js"></script>
</body>
</html>
